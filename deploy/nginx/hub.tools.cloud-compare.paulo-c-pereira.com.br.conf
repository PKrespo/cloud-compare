server {
    listen 80;
    server_name hub.tools.cloud-compare.paulo-c-pereira.com.br;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name hub.tools.cloud-compare.paulo-c-pereira.com.br;

    ssl_certificate /etc/letsencrypt/live/hub.tools.cloud-compare.paulo-c-pereira.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hub.tools.cloud-compare.paulo-c-pereira.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    root /opt/apps/hub/tools/cloud-compare/current;
    index index.html;

    access_log /var/log/nginx/pcp-tool-cloud-compare-access.log;
    error_log /var/log/nginx/pcp-tool-cloud-compare-error.log;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(png|jpg|jpeg|gif|svg|ico|woff2|woff|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
